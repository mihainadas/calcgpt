name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          calcgpt.py calcgpt_train.py calcgpt_eval.py calcgpt_dategen.py
          demo.py lib scripts examples

      - name: Lint
        run: python -m ruff check .

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build and verify source distribution
        if: matrix.python-version == '3.11'
        run: |
          python -m build
          mkdir -p /tmp/calcgpt-sdist
          tar -xzf dist/calc_gpt-*.tar.gz --strip-components=1 -C /tmp/calcgpt-sdist
          cd /tmp/calcgpt-sdist
          python -m unittest discover -s tests -p "test_*.py" -v
