name: Reproducibility

"on":
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproduce-data:
    name: Reproduce canonical data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Generate canonical padded dataset
        run: |
          mkdir -p outputs/reproducibility
          python scripts/gen_padded.py \
            --num-examples 40000 \
            --operand-width 3 \
            --seed 42 \
            --output outputs/reproducibility/ds-calcgpt-padded.txt

      - name: Verify byte-for-byte reproducibility
        run: cmp datasets/ds-calcgpt-padded.txt outputs/reproducibility/ds-calcgpt-padded.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Record checksums and environment
        if: always()
        run: |
          mkdir -p outputs/reproducibility
          sha256sum datasets/*.txt > outputs/reproducibility/SHA256SUMS.txt
          if [ -f outputs/reproducibility/ds-calcgpt-padded.txt ]; then
            sha256sum outputs/reproducibility/ds-calcgpt-padded.txt >> outputs/reproducibility/SHA256SUMS.txt
          fi
          python --version > outputs/reproducibility/environment.txt
          python -m pip freeze >> outputs/reproducibility/environment.txt

      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-${{ github.run_id }}
          path: outputs/reproducibility/
          if-no-files-found: error
          retention-days: 30

  artifact-smoke:
    name: Tiny real-ML artifact round trip
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install demo with ML runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[demo]"
          python -m pip check

      - name: Run tiny artifact smoke test
        run: python examples/complete_workflow.py

      - name: Verify self-contained artifact files
        run: |
          test -f models/example-workflow/config.json
          test -f models/example-workflow/model.safetensors
          test -f models/example-workflow/tokenizer.json
          test -f models/example-workflow/task_spec.json
          test -f models/example-workflow/training_manifest.json

      - name: Upload smoke-test provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-smoke-${{ github.run_id }}
          path: |
            models/example-workflow/config.json
            models/example-workflow/model.safetensors
            models/example-workflow/tokenizer.json
            models/example-workflow/task_spec.json
            models/example-workflow/training_manifest.json
          if-no-files-found: warn
          retention-days: 14
