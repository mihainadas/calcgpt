name: Bug report
description: Report a reproducible problem in CalcGPT.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve CalcGPT. Do not include secrets or security reports here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest command, input, seed, and configuration that reproduce the problem.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: CalcGPT revision
      description: Commit SHA or release version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, operating system, device, PyTorch, and Transformers versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant sanitized output.
      render: shell
