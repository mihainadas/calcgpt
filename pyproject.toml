[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calc-gpt"
dynamic = ["version"]
description = "A small GPT-2-style model for experiments in arithmetic generalization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Mihai Nadas" },
]
keywords = ["arithmetic", "education", "gpt-2", "pytorch", "transformers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
train = [
  "torch>=2.7,<3",
  "transformers>=4.52,<5",
  "accelerate>=0.26,<2",
]
demo = [
  "calc-gpt[train]",
  "rich>=13,<15",
]
dev = [
  "build>=1.2,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
calcgpt = "calcgpt:main"
calcgpt-train = "calcgpt_train:main"
calcgpt-eval = "calcgpt_eval:main"
calcgpt-datagen = "calcgpt_dategen:main"

[project.urls]
Homepage = "https://github.com/mihainadas/calcgpt"
Repository = "https://github.com/mihainadas/calcgpt.git"
Issues = "https://github.com/mihainadas/calcgpt/issues"

[tool.setuptools]
include-package-data = false
py-modules = ["calcgpt", "calcgpt_train", "calcgpt_eval", "calcgpt_dategen"]

[tool.setuptools.packages.find]
include = ["lib", "lib.*"]

[tool.setuptools.dynamic]
version = { attr = "lib.version.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["calcgpt.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
