# Canonical experiment specification. The current CLIs do not consume this file
# directly; it is the reviewable source of truth for reproduction commands.

[run]
name = "padded-3digit"
description = "Fixed-width, zero-padded operands with reversed answers"

[data]
generator = "scripts/gen_padded.py"
output = "datasets/ds-calcgpt-padded.txt"
num_examples = 40000
operand_width = 3
seed = 42
answer_order = "reversed"
operations = ["addition", "subtraction"]
allow_negative_results = false

[model]
architecture = "gpt2"
embedding_dim = 128
num_layers = 4
num_heads = 8
feedforward_dim = 256
n_positions = 20

[training]
epochs = 30
batch_size = 64
learning_rate = 0.001
warmup_steps = 100
weight_decay = 0.01
save_steps = 2000
test_split = 0.2
seed = 42
augmentation = false

[evaluation]
operand_width = 3
samples_per_digit_bucket = 100
seed = 42
require_disjoint_training_pairs = true
decoding = "greedy"
